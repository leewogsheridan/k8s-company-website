apiVersion: apps/v1
kind: Deployment

metadata:
  name: company-website

spec:
  replicas: 3

  selector:
    matchLabels:
      app: company-website

  template:
    metadata:
      labels:
        app: company-website

    spec:
      containers:
        - name: company-website
          image: company-website:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          env:
            - name: APP_ENV
              value: "production"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
